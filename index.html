<!DOCTYPE html>
<!-- Ultimate Game Stash file --> 
<html>
<head>
  <title>Minecraft Custom Edition</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Külső fájlok beolvasása -->
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    #game_frame {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
    }
    /* UI Konténer a logónak és az órának */
    #ui_container {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px;
      border-radius: 8px;
      pointer-events: none;
    }
    #custom_logo {
      max-width: 180px; /* Itt állíthatod a logó méretét */
      height: auto;
      margin-bottom: 8px;
    }
  </style>

  <!-- EaglercraftX könyvtárak -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/bubbls/loltheygotbannedfromjsdelivr@38f40924ae70b843f3d4d0a5dc3d6ba13ca3a461/classes.min.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/bubbls/loltheygotbannedfromjsdelivr@38f40924ae70b843f3d4d0a5dc3d6ba13ca3a461/fix-webm-duration.js"></script>
  
  <script type="text/javascript">
    window.addEventListener("load", () => {
      if (document.location.href.startsWith("file:")) {
        console.warn("HTTP szerver szükséges a futtatáshoz![cite: 3]");
      } else {
        window.eaglercraftXOpts = {
          container: "game_frame",
          assetsURI: "https://cdn.jsdelivr.net/gh/bubbls/loltheygotbannedfromjsdelivr@38f40924ae70b843f3d4d0a5dc3d6ba13ca3a461/assets.epk",
          localesURI: "lang/",
          servers: [
            { addr: "wss://mc.arch.lol/", name: "ArchMC" },
            { addr: "wss://mc.asspixel.net", name: "AssPixel" },
            { addr: "wss://zentic.org/", name: "Zentic" }
          ]
        };
        try { main(); } catch (e) { console.error(e); }
      }
    });
  </script>
</head>
<body>
  <!-- Egyéni felület: Kép + Óra -->
  <div id="ui_container">
    <!-- Cseréld ki a 'logo.png' nevet a saját képed nevére -->
    <img src="logo.png" alt="Minecraft Logo" id="custom_logo">
    <div id="currentTime" class="title"></div>
  </div>

  <div id="game_frame"></div>
</body>
</html>
