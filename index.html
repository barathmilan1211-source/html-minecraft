<!DOCTYPE html>
<!-- Ultimate Game Stash file --> 
<html>
<head>
  <title>Minecraft EaglercraftX Edition</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Külső fájlok beolvasása -->
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    #game_frame {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
    }
    /* Az óra elhelyezése a játék felett */
    #currentTime {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 100;
      font-family: monospace;
      background: rgba(0, 0, 0, 0.5);
      padding: 5px 10px;
      border-radius: 4px;
    }
  </style>

  <!-- EaglercraftX alap könyvtárak -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/bubbls/loltheygotbannedfromjsdelivr@38f40924ae70b843f3d4d0a5dc3d6ba13ca3a461/classes.min.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/bubbls/loltheygotbannedfromjsdelivr@38f40924ae70b843f3d4d0a5dc3d6ba13ca3a461/fix-webm-duration.js"></script>
  
  <script type="text/javascript">
    window.addEventListener("load", () => {
      if (document.location.href.startsWith("file:")) {
        alert("HTTP szerver szükséges! Ne várd, hogy helyi fájlként fusson.");
      } else {
        // EaglercraftX beállítások[cite: 3]
        window.eaglercraftXOpts = {
          container: "game_frame",
          assetsURI: "https://cdn.jsdelivr.net/gh/bubbls/loltheygotbannedfromjsdelivr@38f40924ae70b843f3d4d0a5dc3d6ba13ca3a461/assets.epk",
          localesURI: "lang/",
          servers: [
            { addr: "wss://mc.arch.lol/", name: "ArchMC" },
            { addr: "wss://mc.asspixel.net", name: "AssPixel" },
            { addr: "wss://zentic.org/", name: "Zentic" }
          ]
        };
        try { main(); } catch (e) { console.error(e); }
      }
    });
  </script>
</head>
<body>
  <!-- Az óra eleme, ami a script.js-ből kapja az adatot -->
  <div id="currentTime" class="title"></div>

  <div id="game_frame"></div>
</body>
</html>
